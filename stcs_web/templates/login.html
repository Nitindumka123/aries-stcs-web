<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="stcs-csrf-token" content="{{ csrf_token }}">
<title>Sign In - ARIES 104 cm STCS</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="login-background">
  <div class="login-card">
    <div class="login-header">
      <div class="mark">ARIES &middot; STCS</div>
      <h1>104 cm Sampurnanand<br><span>Telescope Console</span></h1>
    </div>
    <form method="post" action="/api/login">
      <input type="hidden" name="_stcs_csrf_token" value="{{ csrf_token }}">
      <label class="f" for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label class="f" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <div class="row mt"><button type="submit" class="btn primary">Sign In</button></div>
    </form>
  </div>
</div>
</body>
</html>
